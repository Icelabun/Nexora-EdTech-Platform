kind = "web"
previewPath = "/"
title = "Nexora"
description = "A gamified EUEE preparation platform for Ethiopian Grade 12 students, with secure accounts, server-validated dungeon quizzes, progress tracking, tournaments, and an AI tutor."
version = "1.0.0"
id = "artifacts/nexora"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23292

[services.development]
run = "pnpm --filter @workspace/nexora run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/nexora", "run", "build" ]
serve = "static"
publicDir = "artifacts/nexora/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23292"
BASE_PATH = "/"
