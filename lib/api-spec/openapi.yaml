openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Nexora learning platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health and readiness operations
  - name: auth
    description: Student, teacher, and admin accounts
  - name: learning
    description: Subjects, progress, and dungeon runs
  - name: social
    description: Leaderboards, tournaments, and classes
  - name: tutor
    description: AI tutor
  - name: billing
    description: Subscription selection and billing status
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Create an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Sign out
      responses:
        "200":
          description: Signed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the current account
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /subjects:
    get:
      operationId: getSubjects
      tags: [learning]
      summary: List EUEE subjects
      responses:
        "200":
          description: Available subjects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Subject"
  /onboarding:
    post:
      operationId: saveOnboarding
      tags: [auth]
      summary: Save weakest subjects
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardingInput"
      responses:
        "200":
          description: Updated account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [learning]
      summary: Get student progress and recent activity
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
  /dungeons:
    post:
      operationId: startDungeon
      tags: [learning]
      summary: Start a server-validated dungeon run
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DungeonStartInput"
      responses:
        "201":
          description: Dungeon started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DungeonQuestion"
  /dungeons/{runId}/answer:
    post:
      operationId: answerDungeonQuestion
      tags: [learning]
      summary: Submit an answer; scoring is calculated on the server
      parameters:
        - in: path
          name: runId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DungeonAnswerInput"
      responses:
        "200":
          description: Answer result and next question
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DungeonAnswerResult"
  /dungeons/{runId}/abandon:
    post:
      operationId: abandonDungeon
      tags: [learning]
      summary: Reset a dungeon after the focus grace period or a manual reset
      parameters:
        - in: path
          name: runId
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DungeonResetInput"
      responses:
        "200":
          description: Run abandoned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /dungeons/{runId}/pause:
    post:
      operationId: pauseDungeon
      tags: [learning]
      summary: Use the one server-limited pause for this run
      parameters:
        - in: path
          name: runId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Dungeon pause started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DungeonPauseState"
  /dungeons/{runId}/resume:
    post:
      operationId: resumeDungeon
      tags: [learning]
      summary: Resume a paused dungeon
      parameters:
        - in: path
          name: runId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Dungeon resumed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DungeonPauseState"
  /dungeons/branch-choice:
    post:
      operationId: chooseDungeonBranch
      tags: [learning]
      summary: Save the one-time post-boss path choice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BranchChoiceInput"
      responses:
        "200":
          description: Choice saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /daily-reward:
    get:
      operationId: getDailyReward
      tags: [learning]
      summary: Get today's Gate Opens reward status
      responses:
        "200":
          description: Daily reward status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyRewardStatus"
  /daily-reward/claim:
    post:
      operationId: claimDailyReward
      tags: [learning]
      summary: Claim today's non-streak daily reward
      responses:
        "200":
          description: Reward claimed or already claimed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyRewardClaim"
  /event/session:
    get:
      operationId: getEventSession
      tags: [learning]
      summary: Resume the student's persisted supernatural investigation
      responses:
        "200":
          description: Current event session and revealed case-board state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventSessionResponse"
  /event/session/start:
    post:
      operationId: startEventSession
      tags: [learning]
      summary: Start the one-time supernatural case after choosing its door
      responses:
        "201":
          description: Investigation started or resumed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventSessionResponse"
  /event/session/answer:
    post:
      operationId: answerEventProblem
      tags: [learning]
      summary: Submit the current case or monster problem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventAnswerInput"
      responses:
        "200":
          description: Answer evaluated and persisted case state returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventAnswerResult"
  /leaderboards:
    get:
      operationId: getLeaderboards
      tags: [social]
      summary: Get a global or subject leaderboard
      parameters:
        - in: query
          name: subject
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Ranked students
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeaderboardEntry"
  /tournaments:
    get:
      operationId: getTournaments
      tags: [social]
      summary: List open tournaments and payout breakdown
      responses:
        "200":
          description: Tournament list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tournament"
  /tournaments/{tournamentId}/join:
    post:
      operationId: joinTournament
      tags: [social]
      summary: Enter a free or paid tournament
      parameters:
        - in: path
          name: tournamentId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Tournament entry status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TournamentEntry"
  /tournaments/{tournamentId}/rounds/start:
    post:
      operationId: startTournamentRound
      tags: [social]
      summary: Start or resume the current timed tournament round
      parameters:
        - in: path
          name: tournamentId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Current tournament question
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TournamentRoundQuestion"
  /tournaments/{tournamentId}/rounds/answer:
    post:
      operationId: answerTournamentRound
      tags: [social]
      summary: Submit one answer in the active tournament round
      parameters:
        - in: path
          name: tournamentId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TournamentAnswerInput"
      responses:
        "200":
          description: Authoritatively scored tournament answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TournamentAnswer"
  /tournaments/{tournamentId}/leaderboard:
    get:
      operationId: getTournamentLeaderboard
      tags: [social]
      summary: List tournament standings ranked by points, speed, then accuracy
      parameters:
        - in: path
          name: tournamentId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Tournament standings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TournamentScoreEntry"
  /ai/tutor:
    post:
      operationId: askTutor
      tags: [tutor]
      summary: Ask the AI tutor a question
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TutorInput"
      responses:
        "200":
          description: Tutor answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TutorReply"
  /classes:
    get:
      operationId: getClasses
      tags: [social]
      summary: List teacher classes
      responses:
        "200":
          description: Teacher classes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Class"
    post:
      operationId: createClass
      tags: [social]
      summary: Create a class and join code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClassInput"
      responses:
        "201":
          description: Class created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Class"
  /classes/join:
    post:
      operationId: joinClass
      tags: [social]
      summary: Join a teacher class with its code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClassJoinInput"
      responses:
        "200":
          description: Joined class
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Class"
  /classes/{classId}/students:
    get:
      operationId: getClassStudents
      tags: [social]
      summary: Get student engagement and subject performance
      parameters:
        - in: path
          name: classId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Student roster and performance
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClassStudent"
  /assignments:
    get:
      operationId: getAssignments
      tags: [teacher]
      summary: List assignments for the signed-in teacher or student's classes
      responses:
        "200":
          description: Assignments visible to the current account
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StudentAssignment"
    post:
      operationId: createAssignment
      tags: [social]
      summary: Assign a dungeon to a class
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignmentInput"
      responses:
        "201":
          description: Assignment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assignment"
  /subscriptions:
    get:
      operationId: getSubscription
      tags: [billing]
      summary: Get current subscription and pricing
      responses:
        "200":
          description: Current subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
    post:
      operationId: selectSubscription
      tags: [billing]
      summary: Choose Free or create a hosted Arena Pass checkout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionInput"
      responses:
        "200":
          description: Subscription status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
  /payments:
    get:
      operationId: getPaymentHistory
      tags: [billing]
      summary: List the signed-in student's payments or all payments for an admin
      responses:
        "200":
          description: Payment history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentHistory"
  /payments/chapa/webhook:
    post:
      operationId: chapaWebhook
      tags: [billing]
      summary: Receive signed Chapa payment and refund events
      description: This endpoint verifies the raw-body Chapa signature and checks the transaction server-side. Browser redirects never grant access.
      responses:
        "200":
          description: Webhook accepted or safely ignored as a duplicate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookAcknowledgement"
        "400":
          description: Invalid signature or malformed event
        "503":
          description: Chapa is not configured or could not be verified
  /payments/{paymentId}/refund:
    post:
      operationId: refundPayment
      tags: [billing]
      summary: Start or retry an admin refund
      parameters:
        - in: path
          name: paymentId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Refund status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefundResult"
  /admin/tournaments/{tournamentId}/cancel:
    post:
      operationId: cancelTournament
      tags: [billing]
      summary: Cancel a tournament and initiate refunds for confirmed paid entries
      parameters:
        - in: path
          name: tournamentId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Tournament cancelled and refund processing started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Message:
      type: object
      properties:
        message: { type: string }
      required: [message]
    User:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        role: { type: string, enum: [student, teacher, admin] }
        grade: { type: integer }
        school: { type: string }
        xp: { type: integer }
        level: { type: integer }
        hunterRank: { type: string }
        streak: { type: integer }
        weakestSubjects:
          type: array
          items: { type: string }
        subscriptionTier: { type: string }
        onboardingComplete: { type: boolean }
        arenaAccessUntil:
          type: string
          format: date-time
          nullable: true
        branchUnlocked: { type: boolean }
        branchChoice:
          type: string
          enum: [solo, event, null]
          nullable: true
      required: [id, name, email, role, grade, school, xp, level, hunterRank, streak, weakestSubjects, subscriptionTier, onboardingComplete, arenaAccessUntil, branchUnlocked, branchChoice]
    RegisterInput:
      type: object
      properties:
        name: { type: string, minLength: 2 }
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
        grade: { type: integer, default: 12 }
        school: { type: string }
        role: { type: string, enum: [student, teacher, admin] }
      required: [name, email, password, grade, school]
    LoginInput:
      type: object
      properties:
        email: { type: string, format: email }
        password: { type: string }
      required: [email, password]
    OnboardingInput:
      type: object
      properties:
        weakestSubjects:
          type: array
          items: { type: string }
          minItems: 1
          maxItems: 6
      required: [weakestSubjects]
    Subject:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        questionCount: { type: integer }
        mastery: { type: integer }
      required: [id, name, questionCount, mastery]
    Dashboard:
      type: object
      properties:
        user: { $ref: "#/components/schemas/User" }
        subjectMastery:
          type: array
          items:
            type: object
            properties:
              subject: { type: string }
              mastery: { type: integer }
            required: [subject, mastery]
        recentRuns:
          type: array
          items:
            $ref: "#/components/schemas/RunSummary"
        dailyRunsRemaining: { type: integer }
      required: [user, subjectMastery, recentRuns, dailyRunsRemaining]
    RunSummary:
      type: object
      properties:
        id: { type: string }
        subject: { type: string }
        rank: { type: string }
        accuracy: { type: integer }
        xpEarned: { type: integer }
        completedAt: { type: string }
      required: [id, subject, rank, accuracy, xpEarned, completedAt]
    DungeonStartInput:
      type: object
      properties:
        subject: { type: string }
        rank: { type: string, enum: [E, D, C, B, A, S] }
        mode: { type: string, enum: [standard, quick], default: standard }
      required: [subject, rank]
    DungeonResetInput:
      type: object
      properties:
        reason: { type: string, enum: [manual, focus-grace-expired, timer-expired] }
      required: [reason]
    DungeonPauseState:
      type: object
      properties:
        paused: { type: boolean }
        pauseUsed: { type: boolean }
        pauseExpiresAt: { type: ["string", "null"], format: date-time }
        timeRemainingSeconds: { type: integer }
      required: [paused, pauseUsed, pauseExpiresAt, timeRemainingSeconds]
    DungeonQuestion:
      type: object
      properties:
        runId: { type: string }
        subject: { type: string }
        rank: { type: string }
        mode: { type: string, enum: [standard, quick] }
        questionId: { type: string }
        prompt: { type: string }
        options:
          type: array
          items: { type: string }
        questionNumber: { type: integer }
        totalQuestions: { type: integer }
        isBoss: { type: boolean }
        playerHp: { type: integer }
        enemyHp: { type: integer }
        expiresAt: { type: ["string", "null"], format: date-time }
        timeRemainingSeconds: { type: integer }
        pauseUsed: { type: boolean }
        paused: { type: boolean }
        pauseExpiresAt: { type: ["string", "null"], format: date-time }
      required: [runId, subject, rank, mode, questionId, prompt, options, questionNumber, totalQuestions, isBoss, playerHp, enemyHp, expiresAt, timeRemainingSeconds, pauseUsed, paused, pauseExpiresAt]
    DungeonAnswerInput:
      type: object
      properties:
        questionId: { type: string }
        answerIndex: { type: integer, minimum: 0, maximum: 3 }
      required: [questionId, answerIndex]
    BranchChoiceInput:
      type: object
      properties:
        choice: { type: string, enum: [solo, event] }
      required: [choice]
    DungeonAnswerResult:
      type: object
      properties:
        correct: { type: boolean }
        explanation: { type: string }
        playerHp: { type: integer }
        enemyHp: { type: integer }
        xpEarned: { type: integer }
        completed: { type: boolean }
        accuracy: { type: integer }
        levelUp: { type: boolean }
        hunterRank: { type: string }
        previousHunterRank: { type: string }
        rankUp: { type: boolean }
        branchUnlocked: { type: boolean }
        nextQuestion:
          anyOf:
            - $ref: "#/components/schemas/DungeonQuestion"
            - type: "null"
      required: [correct, explanation, playerHp, enemyHp, xpEarned, completed, accuracy, levelUp, hunterRank, previousHunterRank, rankUp, branchUnlocked, nextQuestion]
    DailyRewardStatus:
      type: object
      properties:
        claimedToday: { type: boolean }
        welcomeBack: { type: boolean }
        claimedAt: { type: ["string", "null"], format: date-time }
        xpReward: { type: integer }
        itemName: { type: string }
        itemQuantity: { type: integer }
      required: [claimedToday, welcomeBack, claimedAt, xpReward, itemName, itemQuantity]
    DailyRewardClaim:
      type: object
      properties:
        claimed: { type: boolean }
        welcomeBack: { type: boolean }
        xpAwarded: { type: integer }
        itemName: { type: string }
        itemQuantity: { type: integer }
        claimedAt: { type: ["string", "null"], format: date-time }
        hunterRank: { type: string }
        previousHunterRank: { type: string }
        rankUp: { type: boolean }
      required: [claimed, welcomeBack, xpAwarded, itemName, itemQuantity, claimedAt, hunterRank, previousHunterRank, rankUp]
    EventAnswerInput:
      type: object
      properties:
        stepId: { type: string, minLength: 1 }
        answerIndex: { type: integer, minimum: 0, maximum: 3 }
      required: [stepId, answerIndex]
    EventClue:
      type: object
      properties:
        id: { type: string }
        position: { type: integer }
        title: { type: string }
        scene: { type: string }
        clue: { type: string }
        revealed: { type: boolean }
        solved: { type: boolean }
      required: [id, position, title, scene, clue, revealed, solved]
    EventProblem:
      type: object
      properties:
        stepId: { type: string }
        title: { type: string }
        scene: { type: string }
        subject: { type: string, enum: [Math, Chemistry] }
        difficulty: { type: integer }
        prompt: { type: string }
        options: { type: array, items: { type: string } }
        finale: { type: boolean }
        hpDamage: { type: integer }
      required: [stepId, title, scene, subject, difficulty, prompt, options, finale, hpDamage]
    EventReward:
      type: object
      properties:
        xp: { type: integer }
        badge: { type: string }
        title: { type: string }
      required: [xp, badge, title]
    EventMonster:
      type: object
      properties:
        name: { type: string }
        hp: { type: integer }
        maxHp: { type: integer }
      required: [name, hp, maxHp]
    EventSession:
      type: object
      properties:
        id: { type: string }
        status: { type: string, enum: [active, completed, expired] }
        caseTitle: { type: string }
        intro: { type: string }
        startedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        timeRemainingSeconds: { type: integer }
        focusRemaining: { type: integer }
        focusTotal: { type: integer }
        currentLeadIndex: { type: integer }
        leadCount: { type: integer }
        clues: { type: array, items: { $ref: "#/components/schemas/EventClue" } }
        currentProblem: { anyOf: [{ $ref: "#/components/schemas/EventProblem" }, { type: "null" }] }
        monster: { anyOf: [{ $ref: "#/components/schemas/EventMonster" }, { type: "null" }] }
        reward: { $ref: "#/components/schemas/EventReward" }
        rewardGranted: { type: boolean }
      required: [id, status, caseTitle, intro, startedAt, expiresAt, timeRemainingSeconds, focusRemaining, focusTotal, currentLeadIndex, leadCount, clues, currentProblem, monster, reward, rewardGranted]
    EventSessionResponse:
      type: object
      properties:
        available: { type: boolean }
        message: { type: string }
        session: { anyOf: [{ $ref: "#/components/schemas/EventSession" }, { type: "null" }] }
      required: [available, message, session]
    EventAnswerResult:
      type: object
      properties:
        correct: { type: boolean }
